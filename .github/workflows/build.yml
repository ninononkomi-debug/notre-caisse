name: Construire Notre Caisse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  VITE_GH_REPO: ${{ github.repository }}
  VITE_APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Installer
        run: npm ci
      - name: Construire l'application web
        run: npm run build
      - name: Copier dans le projet Android
        run: npx cap sync android
      - name: Clé de signature
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_PASS" ]; then
            P=$(printf "%s" "$KEYSTORE_PASS" | tr -d ' \r\n\t')
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/caisse.jks.enc -out "$RUNNER_TEMP/caisse.jks" -pass pass:"$P" || { echo "::error::Le secret KEYSTORE_PASS est incorrect"; exit 1; }
            echo "KEYSTORE_FILE=$RUNNER_TEMP/caisse.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de secret KEYSTORE_PASS : APK de test non signée avec la clé définitive"
          fi
      - name: Compiler l'APK
        env:
          # mot de passe interne de la clé ; la clé elle-même est chiffrée (secret KEYSTORE_PASS)
          KEYSTORE_PASSWORD: lcq-Sieq0q0IAgtu0uUdWSFZxwr0E-1k
          KEY_ALIAS: notrecaisse
          KEY_PASSWORD: lcq-Sieq0q0IAgtu0uUdWSFZxwr0E-1k
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Notre-Caisse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Notre-Caisse-apk
          path: Notre-Caisse.apk
      - name: Publier la version
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Notre Caisse 1.0.${{ github.run_number }}
          body: "Téléchargez **Notre-Caisse.apk** ci-dessous et ouvrez-le sur votre téléphone Android."
          files: Notre-Caisse.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
